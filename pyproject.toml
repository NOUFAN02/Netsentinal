[project]
name = "netsentinel"
version = "0.1.0"
description = "Suricata IDS event correlation, intelligence enrichment, and security dashboard stack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["cybersecurity", "suricata", "ids", "threat-intelligence", "flask", "security-monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "pytest",
  "Flask",
  "flask-cors",
  "requests",
  "python-dotenv",
  "reportlab",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
