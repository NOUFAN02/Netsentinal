<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetSentinel Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-alt: #172235;
        --text: #e7edf9;
        --muted: #9ab0d3;
        --accent: #4dd0e1;
        --danger: #ff5d73;
        --warn: #ffb454;
        --ok: #7ae582;
        --grid: rgba(255, 255, 255, 0.06);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .header h1 {
        margin: 0;
        font-size: 2rem;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      .stat {
        background: var(--panel);
        border: 1px solid var(--grid);
        border-radius: 12px;
        padding: 18px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
      }

      .stat-value {
        font-size: 2rem;
        margin-top: 12px;
        font-weight: bold;
      }

      .charts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--grid);
        border-radius: 12px;
        padding: 16px;
      }

      .panel h3 {
        margin-top: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--grid);
      }

      th {
        color: var(--muted);
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      tr:hover { background: rgba(255,255,255,0.02); }
      tbody tr { cursor: pointer; }

      .risk-badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: bold;
      }

      .risk-High { background: rgba(255, 93, 115, 0.12); color: #ff8ca0; }
      .risk-Medium { background: rgba(255, 180, 84, 0.12); color: #ffcd82; }
      .risk-Low { background: rgba(122, 229, 130, 0.12); color: #a4efae; }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        z-index: 10;
        align-items: center;
        justify-content: center;
      }

      .modal.show { display: flex; }

      .modal-content {
        background: var(--panel-alt);
        border: 1px solid var(--grid);
        border-radius: 12px;
        width: min(900px, 90vw);
        max-height: 80vh;
        overflow: auto;
        padding: 20px;
      }

      .close-btn {
        float: right;
        font-size: 1.6rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>NetSentinel</h1>
        <button id="refreshBtn">Refresh</button>
      </div>

      <div class="stats" id="statsGrid"></div>

      <div class="charts">
        <div class="panel">
          <h3>Severity</h3>
          <canvas id="severityChart"></canvas>
        </div>
        <div class="panel">
          <h3>Top Attackers</h3>
          <canvas id="attackersChart"></canvas>
        </div>
        <div class="panel">
          <h3>Protocols</h3>
          <canvas id="protocolsChart"></canvas>
        </div>
      </div>

      <div class="panel">
        <h3>Incidents</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Source</th>
              <th>Destination</th>
              <th>Risk</th>
              <th>Alerts</th>
              <th>End Time</th>
            </tr>
          </thead>
          <tbody id="incidentRows"></tbody>
        </table>
      </div>
    </div>

    <div id="incidentModal" class="modal" aria-modal="true">
      <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>
        <h2>Incident Details</h2>
        <div id="incidentDetail"></div>
      </div>
    </div>

    <script>
      const severityChart = new Chart(document.getElementById('severityChart'), {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: ['#ff5d73', '#ffb454', '#7ae582'] }] },
        options: { responsive: true }
      });

      const attackersChart = new Chart(document.getElementById('attackersChart'), {
        type: 'bar',
        data: { labels: [], datasets: [{ label: 'Alerts', data: [], backgroundColor: '#4dd0e1' }] },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
      });

      const protocolsChart = new Chart(document.getElementById('protocolsChart'), {
        type: 'bar',
        data: { labels: [], datasets: [{ label: 'Count', data: [], backgroundColor: '#7b9cff' }] },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
      });

      function setStats(data) {
        const stats = [
          { label: 'Total alerts', value: data.totalAlerts || 0 },
          { label: 'Incidents', value: data.totalIncidents || 0 },
          { label: 'High risk', value: data.highRisk || 0 },
          { label: 'Active', value: data.openIncidents || 0 }
        ];

        document.getElementById('statsGrid').innerHTML = stats.map(s => `
          <div class="stat">
            <div class="stat-label">${s.label}</div>
            <div class="stat-value">${s.value}</div>
          </div>
        `).join('');
      }

      function renderRows(incidents) {
        const tbody = document.getElementById('incidentRows');
        tbody.innerHTML = incidents.map(inc => `
          <tr data-id="${inc.id}">
            <td>${inc.id}</td>
            <td>${inc.src_ip}</td>
            <td>${inc.dest_ip}</td>
            <td><span class="risk-badge risk-${inc.risk || 'Low'}">${inc.risk || 'Low'}</span></td>
            <td>${inc.alert_count || 0}</td>
            <td>${inc.end_time || '-'}</td>
          </tr>
        `).join('');

        tbody.querySelectorAll('tr').forEach((row) => {
          row.addEventListener('click', () => openIncident(row.dataset.id));
        });
      }

      async function loadDashboard() {
        const incidentsRes = await fetch('http://localhost:5000/api/incidents');
        const incidents = await incidentsRes.json();
        const severityRes = await fetch('http://localhost:5000/api/stats/severity');
        const severity = await severityRes.json();
        const attackersRes = await fetch('http://localhost:5000/api/stats/top_attackers');
        const attackers = await attackersRes.json();
        const protocolsRes = await fetch('http://localhost:5000/api/stats/protocols');
        const protocols = await protocolsRes.json();

        const totalAlerts = severity.reduce((sum, item) => sum + Number(item.c || 0), 0);
        const highRisk = incidents.filter(item => (item.risk || '').toLowerCase() === 'high').length;
        const openCount = incidents.filter(item => (item.status || 'open') === 'open').length;

        setStats({
          totalAlerts,
          totalIncidents: incidents.length,
          highRisk,
          openIncidents: openCount
        });

        severityChart.data.labels = severity.map(s => s.severity || 'Unknown');
        severityChart.data.datasets[0].data = severity.map(s => Number(s.c || 0));
        severityChart.update();

        attackersChart.data.labels = attackers.map(a => a.ip || 'Unknown');
        attackersChart.data.datasets[0].data = attackers.map(a => Number(a.c || 0));
        attackersChart.update();

        protocolsChart.data.labels = protocols.map(p => p.proto || 'Unknown');
        protocolsChart.data.datasets[0].data = protocols.map(p => Number(p.c || 0));
        protocolsChart.update();

        renderRows(incidents);
      }

      async function openIncident(id) {
        const res = await fetch(`http://localhost:5000/api/incidents/${id}`);
        const data = await res.json();
        const detail = document.getElementById('incidentDetail');

        const alerts = (data.alerts || []).map(alert => `
          <tr>
            <td>${alert.timestamp || ''}</td>
            <td>${alert.signature || ''}</td>
            <td>${alert.severity || ''}</td>
            <td>${alert.src_ip || ''}</td>
            <td>${alert.dest_ip || ''}</td>
          </tr>
        `).join('');

        detail.innerHTML = `
          <p><strong>ID:</strong> ${data.id}</p>
          <p><strong>Source:</strong> ${data.src_ip}</p>
          <p><strong>Destination:</strong> ${data.dest_ip}</p>
          <p><strong>Risk:</strong> ${data.risk}</p>
          <p><strong>Intel:</strong> ${data.src_intel ? JSON.stringify(data.src_intel) : 'n/a'} / ${data.dest_intel ? JSON.stringify(data.dest_intel) : 'n/a'}</p>
          <table>
            <thead>
              <tr><th>Time</th><th>Signature</th><th>Severity</th><th>Source</th><th>Destination</th></tr>
            </thead>
            <tbody>${alerts || '<tr><td colspan="5">No alerts</td></tr>'}</tbody>
          </table>
        `;

        document.getElementById('incidentModal').classList.add('show');
      }

      document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('incidentModal').classList.remove('show');
      });
      document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
      setInterval(loadDashboard, 5000);
      loadDashboard();
    </script>
  </body>
</html>
